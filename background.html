<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Particle Fabric - Pure HTML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0e0702;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        #threejs-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            pointer-events: none;
        }

        .hero-content * {
            pointer-events: auto;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        p {
            max-width: 600px;
            font-size: 1.15rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.75rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            background: #f59e0b;
            color: #030712;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease;
        }

        .btn:hover {
            transform: scale(1.04);
        }
    </style>
</head>

<body>
    <!-- 3D Canvas Container -->
    <div id="threejs-bg"></div>

    <!-- Your Website Content (Overlaid above the 3D Canvas) -->
    <div class="hero-content">
        <h1>Quantum Particle Fabric</h1>
        <p>Move your cursor across the screen to warp and undulate the 3D particle field.</p>
        <button class="btn" onclick="alert('3D Background Works!')">Explore Website</button>
    </div>

    <!-- Three.js ES Module -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // 1. Initialize Scene, Camera & WebGL Renderer
        const container = document.getElementById('threejs-bg');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#0e0702');
        scene.fog = new THREE.FogExp2(new THREE.Color('#0e0702').getHex(), 0.016);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 22, 38);
        camera.lookAt(0, -3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // 2. Build High-Density Particle Fabric Grid
        const particleCount = 12000;
        const cols = Math.floor(Math.sqrt(particleCount * 1.5)); // ~134
        const rows = Math.floor(particleCount / cols); // ~89
        const actualCount = cols * rows;

        const width = 80;
        const depth = 65;

        const positions = new Float32Array(actualCount * 3);
        const baseCoords = new Float32Array(actualCount * 2);
        const colors = new Float32Array(actualCount * 3);

        const colPrimary = new THREE.Color('#f59e0b');
        const colSecondary = new THREE.Color('#ea580c');
        const colAccent = new THREE.Color('#fde047');

        let idx = 0;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const u = (c / (cols - 1) - 0.5) * width;
                const v = (r / (rows - 1) - 0.5) * depth;

                const i3 = idx * 3;
                positions[i3] = u;
                positions[i3 + 1] = 0;
                positions[i3 + 2] = v;

                baseCoords[idx * 2] = u;
                baseCoords[idx * 2 + 1] = v;

                colors[i3] = colPrimary.r;
                colors[i3 + 1] = colPrimary.g;
                colors[i3 + 2] = colPrimary.b;
                idx++;
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Procedural soft glowing circle point texture
        const texCanvas = document.createElement('canvas');
        texCanvas.width = 32;
        texCanvas.height = 32;
        const ctx = texCanvas.getContext('2d');
        const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.35, 'rgba(255,255,255,0.7)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 32, 32);
        const particleTex = new THREE.CanvasTexture(texCanvas);
        particleTex.colorSpace = THREE.SRGBColorSpace;

        const material = new THREE.PointsMaterial({
            vertexColors: true,
            size: 2.2,
            map: particleTex,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });

        const pointsMesh = new THREE.Points(geometry, material);
        scene.add(pointsMesh);

        // 3. Mouse Tracking & Kinematics
        const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
        window.addEventListener('mousemove', (e) => {
            mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        }, { passive: true });

        // Touch support for mobile devices
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.targetX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.targetY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }, { passive: true });

        // 4. Animation Loop
        const clock = new THREE.Clock();
        const speed = 1;

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();
            const t = elapsed * 1.2 * speed;

            // Smooth mouse damping
            mouse.x = THREE.MathUtils.damp(mouse.x, mouse.targetX, 6, delta);
            mouse.y = THREE.MathUtils.damp(mouse.y, mouse.targetY, 6, delta);

            const posArray = geometry.attributes.position.array;
            const colArray = geometry.attributes.color.array;

            const mousePlaneX = mouse.x * (width * 0.4);
            const mousePlaneZ = -mouse.y * (depth * 0.4);

            for (let i = 0; i < actualCount; i++) {
                const i3 = i * 3;
                const i2 = i * 2;
                const bx = baseCoords[i2];
                const bz = baseCoords[i2 + 1];

                // Harmonic multi-frequency wave interference
                const wave1 = Math.sin(bx * 0.15 + t) * Math.cos(bz * 0.14 + t * 0.8) * 3.2;
                const wave2 = Math.sin((bx + bz) * 0.09 - t * 1.4) * 2.0;
                const distFromCenter = Math.sqrt(bx * bx + bz * bz);
                const wave3 = Math.cos(distFromCenter * 0.18 - t * 1.8) * 1.4;

                let y = wave1 + wave2 + wave3;

                // Dynamic mouse perturbation
                const dx = bx - mousePlaneX;
                const dz = bz - mousePlaneZ;
                const dSq = dx * dx + dz * dz;

                if (dSq < 140) {
                    const d = Math.sqrt(dSq);
                    const factor = (1 - d / 11.8);
                    y += Math.sin(d * 1.2 - t * 4) * factor * 5.0 * 1;
                }

                posArray[i3 + 1] = y;

                // Elevation-based chromatic gradient
                const normY = THREE.MathUtils.clamp((y + 4.5) / 9.0, 0, 1);
                const col = normY > 0.7 ? colAccent : normY > 0.35 ? colPrimary : colSecondary;

                colArray[i3] = col.r * (0.6 + normY * 0.4);
                colArray[i3 + 1] = col.g * (0.6 + normY * 0.4);
                colArray[i3 + 2] = col.b * (0.6 + normY * 0.4);
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            // Subtle camera tilt with cursor
            camera.position.x = THREE.MathUtils.damp(camera.position.x, mouse.x * 5.5, 3, delta);
            camera.position.y = THREE.MathUtils.damp(camera.position.y, 22 - mouse.y * 3.5, 3, delta);
            camera.lookAt(0, -3, 0);

            renderer.render(scene, camera);
        }
        animate();

        // 5. Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
